name: Download Multi-Platform and Release

on:
  workflow_dispatch:

jobs:
  download-multiplatform:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect latest version
        id: version
        run: |
          version_output=$(./scripts/detect-version.sh)
          echo "$version_output" | grep "^version_file=" >> $GITHUB_OUTPUT
          echo "$version_output" | grep "^build_version=" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        run: |
          build_version="${{ steps.version.outputs.build_version }}"
          check_output=$(./scripts/check-release.sh "$build_version")
          echo "$check_output" | grep "^release_exists=" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download platform files
        if: steps.check_release.outputs.release_exists == 'false'
        id: download
        run: ./scripts/download-platforms.sh "${{ steps.version.outputs.version_file }}" "${{ steps.version.outputs.build_version }}"

      - name: Generate Release Notes
        if: steps.check_release.outputs.release_exists == 'false'
        id: notes
        run: ./scripts/generate-release-notes.sh "${{ steps.version.outputs.version_file }}" "${{ steps.version.outputs.build_version }}"

      - name: Create Release
        if: steps.check_release.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.build_version }}
          name: ${{ format('Command Line Tools Release {0}', steps.version.outputs.build_version) }}
          body_path: release_notes.txt
          files: downloads/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success Summary
        if: success() && steps.check_release.outputs.release_exists == 'false'
        run: |
          build_version="${{ steps.version.outputs.build_version }}"
          echo "## ✅ 多平台 Release 发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 发布信息" >> $GITHUB_STEP_SUMMARY
          echo "- **构建版本**: \`$build_version\`" >> $GITHUB_STEP_SUMMARY
          echo "- **版本文件**: \`${{ steps.version.outputs.version_file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 上传的文件:" >> $GITHUB_STEP_SUMMARY
          if [ -f file_list.txt ]; then
            cat file_list.txt | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          cat download_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Release Already Exists Summary
        if: steps.check_release.outputs.release_exists == 'true'
        run: |
          build_version="${{ steps.version.outputs.build_version }}"
          echo "## ℹ️ Release 已存在，跳过发布" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 版本信息" >> $GITHUB_STEP_SUMMARY
          echo "- **构建版本**: \`$build_version\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "该版本的 Release 已在仓库中存在，无需重复发布。" >> $GITHUB_STEP_SUMMARY

      - name: Failure Summary
        if: failure()
        run: |
          echo "## ❌ Release 发布失败" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 调试信息" >> $GITHUB_STEP_SUMMARY
          echo "- 检查 **versions/** 目录中是否存在版本 JSON 文件" >> $GITHUB_STEP_SUMMARY
          echo "- 检查版本 JSON 文件中的下载链接是否有效" >> $GITHUB_STEP_SUMMARY
          echo "- 查看完整日志获取更多信息" >> $GITHUB_STEP_SUMMARY
          if [ -f download_summary.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 下载摘要" >> $GITHUB_STEP_SUMMARY
            cat download_summary.md >> $GITHUB_STEP_SUMMARY
          fi
